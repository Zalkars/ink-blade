<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Paper gradient -->
    <radialGradient id="v2v3_paper" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#faf4e8"/>
      <stop offset="55%" stop-color="#ece0c7"/>
      <stop offset="100%" stop-color="#cfbc94"/>
    </radialGradient>

    <!-- Blood Moon Halo -->
    <radialGradient id="v2v3_sun" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f02a36"/>
      <stop offset="55%" stop-color="#ab141e"/>
      <stop offset="100%" stop-color="#4a060a"/>
    </radialGradient>

    <!-- Scarf Gradient -->
    <linearGradient id="v2v3_scarf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b47"/>
      <stop offset="45%" stop-color="#cc1c27"/>
      <stop offset="100%" stop-color="#6e080f"/>
    </linearGradient>

    <!-- Blade Steel Polish -->
    <linearGradient id="v2v3_blade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#120f11"/>
      <stop offset="38%" stop-color="#383235"/>
      <stop offset="47%" stop-color="#ffffff"/>
      <stop offset="56%" stop-color="#d1cac6"/>
      <stop offset="100%" stop-color="#100d0f"/>
    </linearGradient>

    <clipPath id="v2v3_frame">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#v2v3_frame)">
    <!-- Base Parchment Background -->
    <rect width="512" height="512" fill="url(#v2v3_paper)"/>
    <rect width="512" height="512" fill="none" stroke="#684f32" stroke-width="16" opacity="0.25"/>

    <!-- Mountain Silhouette (Sumi-e Wash) -->
    <path d="M-10 400 Q 120 330, 240 370 T 480 340 L 525 370 L 525 520 L -10 520 Z" fill="#cfbe9e" opacity="0.6"/>
    <path d="M-10 435 Q 140 380, 280 420 T 525 390 L 525 520 L -10 520 Z" fill="#9e8a69" opacity="0.45"/>

    <!-- Giant Blood-Red Moon Halo behind Knight (Rim Lighting) -->
    <circle cx="280" cy="205" r="150" fill="url(#v2v3_sun)"/>
    <circle cx="280" cy="205" r="150" fill="none" stroke="#4a070a" stroke-width="3.5" stroke-dasharray="14 6 24 5" opacity="0.4"/>

    <!-- Ink Splatters in Atmosphere -->
    <circle cx="85" cy="120" r="5" fill="#110e10"/>
    <circle cx="65" cy="148" r="3" fill="#110e10"/>
    <circle cx="445" cy="100" r="5" fill="#110e10"/>
    <circle cx="465" cy="125" r="3" fill="#110e10"/>
    <circle cx="420" cy="75" r="2.5" fill="#110e10"/>

    <!-- ========================================== -->
    <!-- TATTERED BILLOWING CRIMSON SCARF -->
    <!-- ========================================== -->
    
    <!-- Scarf Rear Shadow Folds -->
    <path d="M 225 270 
             C 160 280, 95 315, 40 345
             C 10 360, -15 360, -30 382
             C 15 392, 70 385, 120 360
             C 175 332, 230 312, 275 302 Z" 
          fill="#4a060b"/>

    <!-- Scarf Main Upper Wave -->
    <path d="M 250 265 
             C 175 258, 110 295, 60 322
             C 20 342, -10 338, -25 352
             C 10 368, 50 358, 95 335
             C 145 312, 205 288, 270 280 Z" 
          fill="url(#v2v3_scarf)"/>

    <!-- Scarf Lower Cascading Ribbon -->
    <path d="M 245 275 
             C 185 305, 145 360, 110 422
             C 85 465, 50 490, 5 505
             C 38 495, 75 470, 105 435
             C 145 385, 185 328, 255 295 Z" 
          fill="url(#v2v3_scarf)"/>

    <!-- White Chalk Ink Motion & Wind Streaks on Scarf -->
    <path d="M 60 322 Q 28 332, -2 338 M 95 335 Q 45 350, 10 358" stroke="#ff858e" stroke-width="2.5" fill="none" opacity="0.65"/>
    <path d="M 110 422 Q 80 458, 28 490" stroke="#7a0a12" stroke-width="2.5" fill="none" opacity="0.8"/>
    <!-- Scarf flying blood specks -->
    <circle cx="45" cy="328" r="3" fill="#ff3b47"/>
    <circle cx="75" cy="425" r="3.5" fill="#ff3b47"/>
    <circle cx="15" cy="370" r="2.5" fill="#a8151f"/>

    <!-- ========================================== -->
    <!-- THE INK KNIGHT (Faceted Shinobi Mask & Armor) -->
    <!-- ========================================== -->
    
    <!-- Torso and Broad Warrior Shoulders -->
    <path d="M 140 520 
             C 160 410, 195 325, 240 275 
             C 275 240, 340 250, 375 290 
             C 425 350, 455 430, 470 520 Z" 
          fill="#110e10"/>

    <!-- Layered Shoulder Armor (Sode Plates) with Chalk Highlights -->
    <path d="M 330 280 C 370 300, 420 340, 435 410" fill="none" stroke="#f0e8d5" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M 345 310 C 380 330, 415 370, 430 430" fill="none" stroke="#f0e8d5" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
    
    <!-- Torso Chalk Ink Contours -->
    <path d="M 215 315 Q 198 375, 190 445 T 185 520" fill="none" stroke="#f0e8d5" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 235 305 Q 252 360, 268 430" fill="none" stroke="#f0e8d5" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

    <!-- Shinobi Mask / Head Silhouette (Faceted, Sharp Jawline) -->
    <path d="M 215 285 
             L 205 240 
             L 218 190 
             L 245 150 
             L 295 140 
             L 335 155 
             L 355 195 
             L 350 245 
             L 320 285 
             L 265 305 
             Z" 
          fill="#110e10"/>

    <!-- Sharp Mask Cheekbone & Jaw Facet Highlights -->
    <path d="M 205 240 L 235 265 L 265 305" stroke="#f0e8d5" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 218 190 L 250 215 L 235 265" stroke="#f0e8d5" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.5"/>

    <!-- Curved Insectoid Horns / Demon Crest -->
    <!-- Left Horn (Rear) -->
    <path d="M 255 150 
             C 240 110, 218 70, 185 30 
             C 178 22, 188 18, 195 24 
             C 225 58, 258 100, 270 145 Z" 
          fill="#110e10"/>
    
    <!-- Right Horn (Front, Prominent) with Segmented Ridges -->
    <path d="M 298 142 
             C 300 90, 280 40, 248 -2 
             C 242 -10, 252 -12, 258 -5 
             C 294 40, 322 92, 320 148 Z" 
          fill="#181517"/>
    <!-- Horn Ridge Crosshatch Scratches -->
    <path d="M 255 3 C 285 45, 312 95, 310 145" fill="none" stroke="#f0e8d5" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="270" y1="35" x2="280" y2="40" stroke="#f0e8d5" stroke-width="2" opacity="0.6"/>
    <line x1="285" y1="65" x2="295" y2="70" stroke="#f0e8d5" stroke-width="2" opacity="0.6"/>
    <line x1="298" y1="95" x2="308" y2="100" stroke="#f0e8d5" stroke-width="2" opacity="0.6"/>

    <!-- THE GLOWING RUBY EYE & BLAZING EYE FLARE -->
    <!-- Intense Horizontal Light Beam extending across face and space -->
    <path d="M 120 212 L 360 202" stroke="#ff2635" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 190 211 L 310 206" stroke="#ff6b77" stroke-width="6.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Outer Eye Bloom & Burning Aura -->
    <circle cx="255" cy="208" r="18" fill="#ff2635" opacity="0.4"/>
    <!-- Core Crimson Eye -->
    <ellipse cx="255" cy="208" rx="10" ry="8" fill="#ff2635"/>
    <!-- Intense White Pupil Flare -->
    <circle cx="255" cy="208" r="4" fill="#ffffff"/>
    
    <!-- Burning Embers Floating from the Eye -->
    <circle cx="230" cy="200" r="2.5" fill="#ff4755"/>
    <circle cx="215" cy="192" r="2" fill="#ff4755"/>
    <circle cx="275" cy="218" r="2" fill="#ff4755"/>

    <!-- ========================================== -->
    <!-- THE DRAWN KATANA & GLOVED WARRIOR HAND -->
    <!-- ========================================== -->
    
    <!-- Forearm extending across in fighting stance -->
    <path d="M 240 345 L 180 382 L 160 365 L 215 325 Z" fill="#110e10"/>
    <!-- Gloved Hand holding Guard -->
    <ellipse cx="170" cy="372" rx="16" ry="11" transform="rotate(-38, 170, 372)" fill="#1c181a" stroke="#f0e8d5" stroke-width="1.8" opacity="0.9"/>

    <!-- Katana in Foreground Angle -->
    <g transform="translate(165, 370) rotate(-38)">
      <!-- Blade Drop Shadow -->
      <path d="M -2 -220 L 11 -210 L 7 95 L -7 95 Z" fill="#0c0a0b" opacity="0.35"/>
      <!-- Blade Steel Glow -->
      <path d="M 0 -220 L 10 -210 L 6 95 L -6 95 Z" fill="url(#v2v3_blade)"/>
      <!-- White Razor Cutting Edge -->
      <path d="M 0 -220 L 10 -210 L 6 95 Z" fill="#ffffff" opacity="0.95"/>
      <line x1="0" y1="-220" x2="0" y2="95" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
      
      <!-- Blood droplet on blade -->
      <circle cx="8" cy="-85" r="4" fill="#e6202c"/>
      <circle cx="8" cy="-62" r="2.5" fill="#e6202c"/>

      <!-- Brilliant Star Glint on Blade Edge -->
      <g transform="translate(4, -120)">
        <line x1="-15" y1="0" x2="15" y2="0" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      </g>

      <!-- Tsuba (Guard) in Rich Gold and Dark Iron -->
      <ellipse cx="0" cy="95" rx="26" ry="8" fill="#181516" stroke="#caa248" stroke-width="2.8"/>
      <ellipse cx="0" cy="95" rx="16" ry="4" fill="#caa248" opacity="0.45"/>

      <!-- Tsuka (Hilt) -->
      <rect x="-6" y="103" width="12" height="68" fill="#110e10"/>
      <polygon points="0,111 -4,119 0,127 4,119" fill="#a81921"/>
      <polygon points="0,127 -4,135 0,143 4,135" fill="#a81921"/>
      <polygon points="0,143 -4,151 0,159 4,151" fill="#a81921"/>
      <rect x="-7" y="168" width="14" height="6" rx="2" fill="#caa248"/>
    </g>

    <!-- Bottom Right Atmospheric Ink Accents -->
    <circle cx="435" cy="430" r="4.5" fill="#110e10" opacity="0.6"/>
    <circle cx="455" cy="450" r="3" fill="#110e10" opacity="0.4"/>
    <circle cx="420" cy="460" r="3" fill="#a8151f" opacity="0.5"/>

    <!-- Outer Rim Highlight for App Icon -->
    <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.45"/>
  </g>
</svg>
